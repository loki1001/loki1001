<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">Loki systems console</title>
  <desc id="description">A pixel operator console illustrating evidence-grounded AI engineering.</desc>

  <defs>
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#D0D7DE"/>
    </pattern>
    <linearGradient id="panel-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0969DA" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0A7A83" stop-opacity="0.01"/>
    </linearGradient>
    <clipPath id="card-clip">
      <rect x="1" y="1" width="1198" height="438" rx="22"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="438" rx="22" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2"/>

  <g clip-path="url(#card-clip)">
    <rect x="1" y="1" width="1198" height="54" fill="#F6F8FA"/>
    <path d="M1 55H1199" stroke="#D0D7DE"/>
    <circle cx="29" cy="28" r="6" fill="#AFB8C1"/>
    <circle cx="52" cy="28" r="6" fill="#AFB8C1"/>
    <circle cx="75" cy="28" r="6" fill="#AFB8C1"/>
    <text x="104" y="35" fill="#59636E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">loki1001@github:~/systems</text>

    <rect x="28" y="82" width="332" height="326" rx="18" fill="#FFFFFF" stroke="#D0D7DE"/>
    <rect x="28" y="82" width="332" height="326" fill="url(#dot-grid)" opacity="0.75"/>
    <rect x="28" y="82" width="332" height="326" rx="18" fill="url(#panel-glow)"/>

    <g aria-label="Loki pixel avatar">
      <rect x="76" y="123" width="62" height="62" rx="2" fill="#D6A77F"/>
      <rect x="250" y="123" width="62" height="62" rx="2" fill="#D6A77F"/>
      <rect x="138" y="185" width="112" height="62" rx="2" fill="#D6A77F"/>
      <rect x="76" y="247" width="62" height="62" rx="2" fill="#D6A77F"/>
      <rect x="250" y="247" width="62" height="62" rx="2" fill="#D6A77F"/>
      <rect x="138" y="247" width="112" height="112" rx="2" fill="#D6A77F"/>
      <rect x="138" y="247" width="35" height="45" fill="#FFFFFF"/>
      <rect x="215" y="247" width="35" height="45" fill="#FFFFFF"/>
    </g>

    <text x="117" y="390" fill="#59636E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">pixel operator / online</text>

    <path d="M394 92V396" stroke="#D8DEE4"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="438" y="118" fill="#1A7F37" font-size="25">$</text>
      <text x="466" y="118" fill="#1F2328" font-size="25" font-weight="600">loki build --reliable</text>

      <text x="438" y="170" fill="#1A7F37" font-size="21">[ok]</text>
      <text x="492" y="170" fill="#3D444D" font-size="22">ground claims in evidence</text>

      <text x="438" y="214" fill="#1A7F37" font-size="21">[ok]</text>
      <text x="492" y="214" fill="#3D444D" font-size="22">evaluate behavior before release</text>

      <text x="438" y="258" fill="#1A7F37" font-size="21">[ok]</text>
      <text x="492" y="258" fill="#3D444D" font-size="22">orchestrate resilient workflows</text>

      <text x="438" y="302" fill="#1A7F37" font-size="21">[ok]</text>
      <text x="492" y="302" fill="#3D444D" font-size="22">observe the path to production</text>

      <text x="438" y="360" fill="#0969DA" font-size="19">applied-ai</text>
      <text x="553" y="360" fill="#AFB8C1" font-size="19">/</text>
      <text x="576" y="360" fill="#0A7A83" font-size="19">backend</text>
      <text x="661" y="360" fill="#AFB8C1" font-size="19">/</text>
      <text x="684" y="360" fill="#8250DF" font-size="19">platform</text>
      <rect x="778" y="343" width="11" height="22" rx="2" fill="#0969DA"/>
    </g>
  </g>
</svg>
