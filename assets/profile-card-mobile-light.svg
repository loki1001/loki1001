<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="title description">
  <title id="title">Loki systems console</title>
  <desc id="description">A compact pixel operator console illustrating evidence-grounded AI engineering.</desc>
  <defs>
