    <circle cx="22" cy="21" r="4" fill="#484F58"/>
    <circle cx="38" cy="21" r="4" fill="#484F58"/>
    <circle cx="54" cy="21" r="4" fill="#484F58"/>
    <text x="74" y="27" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">loki1001@github</text>

    <rect x="21" y="59" width="175" height="199" rx="14" fill="#111820" stroke="#30363D"/>
    <rect x="21" y="59" width="175" height="199" fill="url(#dots)" opacity="0.7"/>
    <g aria-label="Loki pixel avatar">
      <rect x="50" y="87" width="34" height="34" rx="1" fill="#E2B995"/>
      <rect x="133" y="87" width="34" height="34" rx="1" fill="#E2B995"/>
      <rect x="84" y="121" width="49" height="34" rx="1" fill="#E2B995"/>
      <rect x="50" y="155" width="34" height="34" rx="1" fill="#E2B995"/>
      <rect x="133" y="155" width="34" height="34" rx="1" fill="#E2B995"/>
      <rect x="84" y="155" width="49" height="62" rx="1" fill="#E2B995"/>
      <rect x="84" y="155" width="16" height="25" fill="#111820"/>
      <rect x="117" y="155" width="16" height="25" fill="#111820"/>
    </g>
    <text x="53" y="241" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">pixel operator / online</text>

    <path d="M217 65V252" stroke="#21262D"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="244" y="97" fill="#3FB950" font-size="28">$</text>
      <text x="274" y="97" fill="#F0F6FC" font-size="28" font-weight="650">loki build --reliable</text>
      <text x="244" y="148" fill="#3FB950" font-size="21">[ok]</text>
      <text x="298" y="148" fill="#C9D1D9" font-size="22">ground · evaluate</text>
      <text x="244" y="191" fill="#3FB950" font-size="21">[ok]</text>
      <text x="298" y="191" fill="#C9D1D9" font-size="22">orchestrate · observe</text>
      <text x="244" y="235" fill="#58A6FF" font-size="18">applied-ai</text>
      <text x="352" y="235" fill="#484F58" font-size="18">/</text>
      <text x="375" y="235" fill="#39D0D8" font-size="18">backend</text>
      <text x="456" y="235" fill="#484F58" font-size="18">/</text>
      <text x="479" y="235" fill="#D2A8FF" font-size="18">platform</text>
