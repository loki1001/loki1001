<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Lokaranjan Munta — Applied AI systems and backend platform engineering</title>
  <desc id="desc">A restrained profile card with an LM monogram and a visual path from source evidence through bounded evaluation to a reliable production service.</desc>

  <defs>
    <linearGradient id="flow" x1="844" y1="0" x2="1132" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0969DA"/>
      <stop offset="0.52" stop-color="#8250DF"/>
      <stop offset="1" stop-color="#1A7F37"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="1" y="1" width="1198" height="238" rx="20"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="238" rx="20" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2"/>

  <g clip-path="url(#card)">
    <path d="M1 45V21Q1 1 21 1H92" fill="none" stroke="#0969DA" stroke-width="2.5"/>
    <path d="M1108 239H1179Q1199 239 1199 219V195" fill="none" stroke="#1A7F37" stroke-width="2.5"/>

    <!-- Hand-drawn identity mark; no font or external asset dependency. -->
    <g transform="translate(43 80)" fill="none" stroke="#0969DA" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M0 0V72H31"/>
      <path d="M49 72V0L72 35L95 0V72"/>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="184" y="108" fill="#1F2328" font-size="44" font-weight="680" letter-spacing="-1.1">Lokaranjan Munta</text>
      <text x="185" y="151" fill="#59636E" font-size="21" font-weight="500" letter-spacing="0.2">Applied AI systems · Backend/platform engineering</text>
    </g>

    <path d="M782 47V193" stroke="#D8DEE4" stroke-width="1.5"/>

    <!-- Source evidence -->
    <g>
      <rect x="829" y="91" width="48" height="58" rx="7" fill="#FFFFFF" stroke="#0969DA" stroke-width="2" opacity="0.45"/>
      <rect x="837" y="83" width="48" height="58" rx="7" fill="#FFFFFF" stroke="#0969DA" stroke-width="2" opacity="0.7"/>
      <rect x="845" y="75" width="48" height="58" rx="7" fill="#FFFFFF" stroke="#0969DA" stroke-width="2.5"/>
      <path d="M857 92h24M857 102h18M857 112h22" stroke="#0969DA" stroke-width="3" stroke-linecap="round" opacity="0.82"/>
    </g>

    <path d="M895 106H942" stroke="url(#flow)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="895" cy="106" r="4" fill="#0969DA"/>

    <!-- Bounded evaluation loop -->
    <g transform="translate(981 106)">
      <circle r="37" fill="none" stroke="#8250DF" stroke-width="2.5" opacity="0.24"/>
      <path d="M-25-15A29 29 0 0 1 24-16" fill="none" stroke="#8250DF" stroke-width="3.5" stroke-linecap="round"/>
      <path d="m20-23 6 8-10 2" fill="none" stroke="#8250DF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M25 15A29 29 0 0 1-24 16" fill="none" stroke="#8250DF" stroke-width="3.5" stroke-linecap="round"/>
      <path d="m-20 23-6-8 10-2" fill="none" stroke="#8250DF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-8 0-2 6 10-7" fill="none" stroke="#8250DF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <path d="M1020 106H1063" stroke="url(#flow)" stroke-width="4" stroke-linecap="round"/>

    <!-- Reliable production service -->
    <g>
      <rect x="1071" y="77" width="72" height="58" rx="11" fill="#FFFFFF" stroke="#1A7F37" stroke-width="2.5"/>
      <path d="M1084 94h31M1084 106h39M1084 118h25" stroke="#1A7F37" stroke-width="3" stroke-linecap="round" opacity="0.72"/>
      <circle cx="1130" cy="94" r="4" fill="#1A7F37"/>
      <path d="M1082 144h50" stroke="#1A7F37" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
      <circle cx="1139" cy="144" r="5" fill="#1A7F37"/>
    </g>

    <path d="M829 176H1143" stroke="url(#flow)" stroke-width="2.5" stroke-linecap="round" opacity="0.24"/>
    <circle cx="829" cy="176" r="4" fill="#0969DA"/>
    <circle cx="981" cy="176" r="4" fill="#8250DF"/>
    <circle cx="1143" cy="176" r="4" fill="#1A7F37"/>
  </g>
</svg>
