      <text x="244" y="235" fill="#0969DA" font-size="18">applied-ai</text>
      <text x="352" y="235" fill="#AFB8C1" font-size="18">/</text>
      <text x="375" y="235" fill="#0A7A83" font-size="18">backend</text>
