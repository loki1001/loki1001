<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-labelledby="title desc">
  <title id="title">Lokaranjan Munta — Applied AI systems and backend platform engineering</title>
  <desc id="desc">A mobile profile card with an LM monogram and a visual path from source evidence through bounded evaluation to a reliable production service.</desc>

  <defs>
    <linearGradient id="flow" x1="111" y1="0" x2="532" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0969DA"/>
      <stop offset="0.52" stop-color="#8250DF"/>
      <stop offset="1" stop-color="#1A7F37"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="1" y="1" width="638" height="278" rx="20"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="638" height="278" rx="20" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2"/>

  <g clip-path="url(#card)">
    <path d="M1 44V21Q1 1 21 1H82" fill="none" stroke="#0969DA" stroke-width="2.5"/>
    <path d="M558 279H619Q639 279 639 259V236" fill="none" stroke="#1A7F37" stroke-width="2.5"/>

    <g transform="translate(42 35) scale(.62)" fill="none" stroke="#0969DA" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M0 0V72H31"/>
      <path d="M49 72V0L72 35L95 0V72"/>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="126" y="79" fill="#1F2328" font-size="42" font-weight="680" letter-spacing="-1">Lokaranjan Munta</text>
      <text x="42" y="132" fill="#59636E" font-size="27" font-weight="500">Applied AI systems</text>
      <text x="42" y="165" fill="#59636E" font-size="27" font-weight="500">Backend/platform engineering</text>
    </g>

    <path d="M42 188H598" stroke="#D8DEE4" stroke-width="1.5"/>

    <!-- Source evidence -->
    <g>
      <rect x="104" y="214" width="34" height="41" rx="5" fill="#FFFFFF" stroke="#0969DA" stroke-width="2" opacity="0.45"/>
      <rect x="111" y="207" width="34" height="41" rx="5" fill="#FFFFFF" stroke="#0969DA" stroke-width="2" opacity="0.7"/>
      <rect x="118" y="200" width="34" height="41" rx="5" fill="#FFFFFF" stroke="#0969DA" stroke-width="2.5"/>
      <path d="M127 212h17M127 221h13M127 230h16" stroke="#0969DA" stroke-width="2.5" stroke-linecap="round" opacity="0.82"/>
    </g>

    <path d="M154 222H252" stroke="url(#flow)" stroke-width="4" stroke-linecap="round"/>

    <!-- Bounded evaluation loop -->
    <g transform="translate(320 222)">
      <circle r="34" fill="none" stroke="#8250DF" stroke-width="2.5" opacity="0.24"/>
      <path d="M-23-14A27 27 0 0 1 22-15" fill="none" stroke="#8250DF" stroke-width="3.5" stroke-linecap="round"/>
      <path d="m18-22 6 8-10 2" fill="none" stroke="#8250DF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M23 14A27 27 0 0 1-22 15" fill="none" stroke="#8250DF" stroke-width="3.5" stroke-linecap="round"/>
      <path d="m-18 22-6-8 10-2" fill="none" stroke="#8250DF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-8 0-2 6 10-7" fill="none" stroke="#8250DF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <path d="M355 222H452" stroke="url(#flow)" stroke-width="4" stroke-linecap="round"/>

    <!-- Reliable production service -->
    <g>
      <rect x="463" y="199" width="69" height="48" rx="10" fill="#FFFFFF" stroke="#1A7F37" stroke-width="2.5"/>
      <path d="M476 214h27M476 224h36M476 234h22" stroke="#1A7F37" stroke-width="3" stroke-linecap="round" opacity="0.72"/>
      <circle cx="519" cy="214" r="4" fill="#1A7F37"/>
      <circle cx="534" cy="255" r="5" fill="#1A7F37"/>
    </g>
  </g>
</svg>
