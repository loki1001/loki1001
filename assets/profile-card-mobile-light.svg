    <text x="74" y="27" fill="#59636E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">loki1001@github</text>

    <rect x="21" y="59" width="175" height="199" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/>
