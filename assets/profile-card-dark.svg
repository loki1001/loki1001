<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">Loki systems console</title>
  <desc id="description">A pixel operator console illustrating evidence-grounded AI engineering.</desc>

  <defs>
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30363D"/>
    </pattern>
    <linearGradient id="panel-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#39D0D8" stop-opacity="0.02"/>
    </linearGradient>
    <clipPath id="card-clip">
      <rect x="1" y="1" width="1198" height="438" rx="22"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="438" rx="22" fill="#0D1117" stroke="#30363D" stroke-width="2"/>

  <g clip-path="url(#card-clip)">
    <rect x="1" y="1" width="1198" height="54" fill="#161B22"/>
    <path d="M1 55H1199" stroke="#30363D"/>
    <circle cx="29" cy="28" r="6" fill="#484F58"/>
    <circle cx="52" cy="28" r="6" fill="#484F58"/>
    <circle cx="75" cy="28" r="6" fill="#484F58"/>
    <text x="104" y="35" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">loki1001@github:~/systems</text>

    <rect x="28" y="82" width="332" height="326" rx="18" fill="#0D1117" stroke="#30363D"/>
    <rect x="28" y="82" width="332" height="326" fill="url(#dot-grid)" opacity="0.7"/>
    <rect x="28" y="82" width="332" height="326" rx="18" fill="url(#panel-glow)"/>

    <g aria-label="Loki pixel avatar">
      <rect x="76" y="123" width="62" height="62" rx="2" fill="#E2B995"/>
      <rect x="250" y="123" width="62" height="62" rx="2" fill="#E2B995"/>
      <rect x="138" y="185" width="112" height="62" rx="2" fill="#E2B995"/>
      <rect x="76" y="247" width="62" height="62" rx="2" fill="#E2B995"/>
      <rect x="250" y="247" width="62" height="62" rx="2" fill="#E2B995"/>
      <rect x="138" y="247" width="112" height="112" rx="2" fill="#E2B995"/>
      <rect x="138" y="247" width="35" height="45" fill="#0D1117"/>
      <rect x="215" y="247" width="35" height="45" fill="#0D1117"/>
    </g>

    <text x="117" y="390" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">pixel operator / online</text>

    <path d="M394 92V396" stroke="#21262D"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="438" y="118" fill="#3FB950" font-size="25">$</text>
      <text x="466" y="118" fill="#F0F6FC" font-size="25" font-weight="600">loki build --reliable</text>

      <text x="438" y="170" fill="#3FB950" font-size="21">[ok]</text>
      <text x="492" y="170" fill="#C9D1D9" font-size="22">ground claims in evidence</text>

      <text x="438" y="214" fill="#3FB950" font-size="21">[ok]</text>
      <text x="492" y="214" fill="#C9D1D9" font-size="22">evaluate behavior before release</text>

      <text x="438" y="258" fill="#3FB950" font-size="21">[ok]</text>
      <text x="492" y="258" fill="#C9D1D9" font-size="22">orchestrate resilient workflows</text>

      <text x="438" y="302" fill="#3FB950" font-size="21">[ok]</text>
      <text x="492" y="302" fill="#C9D1D9" font-size="22">observe the path to production</text>

      <text x="438" y="360" fill="#58A6FF" font-size="19">applied-ai</text>
      <text x="553" y="360" fill="#484F58" font-size="19">/</text>
      <text x="576" y="360" fill="#39D0D8" font-size="19">backend</text>
      <text x="661" y="360" fill="#484F58" font-size="19">/</text>
      <text x="684" y="360" fill="#D2A8FF" font-size="19">platform</text>
      <rect x="778" y="343" width="11" height="22" rx="2" fill="#58A6FF"/>
    </g>
  </g>
</svg>
